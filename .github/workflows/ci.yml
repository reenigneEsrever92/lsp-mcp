name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The adapter only reads the repository, so the default token needs no more.
permissions:
  contents: read

# A new push to a branch or PR supersedes an in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The runner ships a `rust-analyzer` rustup proxy even though the
          # component is absent, so `which("rust-analyzer")` succeeds and the
          # rust e2e test would launch a proxy that exits immediately (taking
          # `lsp-mcp` down with it before the MCP handshake). Install the real
          # component — plus clippy, which the repo's `rust-analyzer.toml`
          # selects for checks — so the test runs against a working server.
          components: rust-analyzer, clippy
      - uses: Swatinem/rust-cache@v2
      # `language_servers.rs` skips a project whose real server is not on
      # `PATH`, so the remaining server tests stay green here.
      - run: cargo test --all-targets --locked

  language-servers:
    name: Language servers (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-analyzer, plus clippy for the repo's `rust-analyzer.toml`
          # check command.
          components: rust-analyzer, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install clangd
        run: sudo apt-get update && sudo apt-get install -y clangd

      - name: Install gopls
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install the TypeScript test project's dependencies
        run: |
          # Install the versions the project pins (typescript ^5.5,
          # typescript-language-server ^4.3) and expose its local bin on PATH —
          # a global `npm install -g` instead pulls the latest
          # typescript-language-server (6.x), which requires node >= 22 and dies
          # at startup under this job's node 20.
          npm install --prefix test-projects/typescript
          echo "$GITHUB_WORKSPACE/test-projects/typescript/node_modules/.bin" >> "$GITHUB_PATH"

      # Drives each `test-projects/` sample against its real server. Anything
      # that could not be installed above is skipped with a printed notice
      # rather than failing the job.
      - name: Run the end-to-end language-server tests
        run: cargo test --test language_servers --locked -- --nocapture --test-threads=1
