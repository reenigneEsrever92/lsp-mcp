[package]
name = "lsp-mcp"
version = "0.1.0"
edition = "2021"
description = "A single-binary adapter that exposes an LSP server to an MCP client over stdio."
license = "MIT"

[[bin]]
name = "lsp-mcp"
path = "src/main.rs"

[[bin]]
name = "fake-lsp-server"
path = "src/bin/fake-lsp-server.rs"

[dependencies]
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "io-std",
    "sync",
    "time",
] }
rmcp = { version = "3.5", features = ["transport-io"] }
clap = { version = "4.6", features = ["derive"] }
lsp-types = "0.97"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
